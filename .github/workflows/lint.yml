name: Go
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3.7.0

    - name: Set up Go
      uses: actions/setup-go@v4.3.0
      with:
        go-version: 1.22

    - name: Install dependencies
      run: go mod tidy

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4.0.1
      with:
        version: v1.57

    - name: Run tests
      run: go test ./...